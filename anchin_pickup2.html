<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding: 20px; }
    .card { max-width: 500px; margin: 0 auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header bg-primary text-white">
    <h4 class="mb-0">➕ 新增學生資料</h4>
  </div>
  <div class="card-body">
    <form id="studentForm">
      
      <div class="mb-3">
        <label class="form-label">學生姓名</label>
        <input type="text" class="form-control" id="name" required>
      </div>

      <div class="row mb-3">
        <div class="col">
          <label class="form-label">學校</label>
          <input type="text" class="form-control" id="school" value="某某國小" required>
        </div>
        <div class="col">
          <label class="form-label">年級</label>
          <select class="form-select" id="grade">
            <option value="1">1 年級</option>
            <option value="2">2 年級</option>
            <option value="3">3 年級</option>
            <option value="4">4 年級</option>
            <option value="5">5 年級</option>
            <option value="6">6 年級</option>
          </select>
        </div>
        <div class="col">
          <label class="form-label">班級 (如:101)</label>
          <input type="number" class="form-control" id="className" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">家長電話</label>
        <input type="tel" class="form-control" id="phone">
      </div>

      <div class="mb-3">
        <label class="form-label d-block">學生身分</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="identity" id="id1" value="安親" checked onchange="toggleDays()">
          <label class="form-check-label" for="id1">安親生 (預設全接)</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="identity" id="id2" value="外生" onchange="toggleDays()">
          <label class="form-check-label" for="id2">外生 (自訂接送)</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label d-block">每週接送日</label>
        <div class="form-check form-check-inline"><input class="form-check-input day-chk" type="checkbox" id="day1" checked><label>一</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input day-chk" type="checkbox" id="day2" checked><label>二</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input day-chk" type="checkbox" id="day3" checked><label>三</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input day-chk" type="checkbox" id="day4" checked><label>四</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input day-chk" type="checkbox" id="day5" checked><label>五</label></div>
      </div>

      <div class="mb-3">
        <label class="form-label">備註</label>
        <input type="text" class="form-control" id="note">
      </div>

      <button type="submit" class="btn btn-success w-100" id="submitBtn">儲存資料</button>
    </form>
    
    <div id="statusMessage" class="mt-3 text-center fw-bold text-success"></div>
  </div>
</div>

<script>
  // 連動邏輯：如果是安親生，自動勾選一到五
  function toggleDays() {
    const isAnqin = document.getElementById('id1').checked;
    const checkboxes = document.querySelectorAll('.day-chk');
    if(isAnqin) {
      checkboxes.forEach(chk => chk.checked = true);
    }
  }

  // 處理表單送出
  document.getElementById('studentForm').addEventListener('submit', function(e) {
    e.preventDefault(); // 避免網頁重新整理
    
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('submitBtn').innerText = "儲存中...";

    // 收集資料
    const data = {
      name: document.getElementById('name').value,
      school: document.getElementById('school').value,
      grade: document.getElementById('grade').value,
      className: document.getElementById('className').value,
      phone: document.getElementById('phone').value,
      identity: document.querySelector('input[name="identity"]:checked').value,
      day1: document.getElementById('day1').checked,
      day2: document.getElementById('day2').checked,
      day3: document.getElementById('day3').checked,
      day4: document.getElementById('day4').checked,
      day5: document.getElementById('day5').checked,
      note: document.getElementById('note').value
    };

    // 呼叫後端 GAS 函數
    google.script.run
      .withSuccessHandler(function(response) {
        document.getElementById('statusMessage').innerText = response;
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').innerText = "儲存資料";
        
        // 清空部分欄位方便連續輸入 (保留學校，因為通常同一批輸入都是同一個學校)
        document.getElementById('name').value = '';
        document.getElementById('className').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('note').value = '';
        document.getElementById('name').focus(); // 游標跳回姓名
      })
      .addStudent(data);
  });
</script>

</body>
</html>
